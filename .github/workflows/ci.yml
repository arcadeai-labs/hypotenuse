name: CI

on:
  pull_request:
  push:
    branches: [main]

# "CI Complete" (the `complete` job) is the single required status check on
# `main`. Adding a job means adding it to `complete.needs` — never touching
# branch protection.

jobs:
  docs:
    name: Docs Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  complete:
    name: CI Complete
    runs-on: ubuntu-latest
    if: always()
    needs: [docs]
    steps:
      # Assert every result IS `success`, rather than listing failures: a
      # denylist fails open the day the platform invents a new outcome.
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }
          echo "All CI jobs succeeded"
