name: CI

on:
  pull_request:
  push:
    branches: [main]

# "CI Complete" (the `complete` job) is the single required status check on
# `main`. Adding a job means adding it to `complete.needs` — never touching
# branch protection.

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The lockfile is at the repo root and governs the whole workspace.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint

  # Includes the docs tests: links and anchors in AGENTS.md, README.md, and
  # docs/, every plan's Learnings heading, and no phase names in source.
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # Postgres with pgvector: the first migration creates the extension, and
      # /api/status is unhealthy without it.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hypotenuse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: cp .env.example .env
      # The `_TEST` overrides win because `loadFromEnvIfSet` checks
      # `${VAR}_${NODE_ENV}` first and `bun test` sets NODE_ENV=test.
      - run: bun run test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/hypotenuse_test
          DATABASE_AUTO_MIGRATE_TEST: "true"
          REDIS_URL_TEST: redis://localhost:6379/1

  backend-docker:
    name: Backend Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f backend/Dockerfile .

  cli:
    name: CLI Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint
      - run: bun run test
      # One target here, so a `--compile` regression is caught before it is a
      # release problem; the full platform matrix belongs to the release.
      - run: bun run build
      - run: ./dist/hypotenuse --version

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run test
      # A missing prop the unit suite never instantiates still fails here.
      - run: bun run build
      # Fonts are self-hosted: nothing in the build may reach for a font CDN.
      - run: "! grep -rEl 'fonts\\.(googleapis|gstatic)\\.com|use\\.typekit\\.net|fonts\\.bunny\\.net' dist"

  # The browser suite: sign-up and sign-in, organizations, members and tags,
  # notifications, the shell and its keymap, the public home, the docs frame,
  # and the style guide. Playwright boots the real backend (its own database
  # and Redis index, see frontend/e2e/env.ts) beside the Vite dev server.
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # Postgres with pgvector: the first migration creates the extension, and
      # /api/status is unhealthy without it.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hypotenuse_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Read by frontend/e2e/env.ts and handed to the backend it starts.
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hypotenuse_e2e
      E2E_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # The backend reads the rest of its configuration (the secrets key, the
      # session cookie) from its `.env`; the e2e env overrides the rest.
      - run: cp .env.example .env
        working-directory: backend
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend-docker:
    name: Frontend Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=https://api.example.com .

  complete:
    name: CI Complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        backend-lint,
        backend-test,
        backend-docker,
        cli,
        frontend-lint,
        frontend-test,
        e2e,
        frontend-docker,
      ]
    steps:
      # Assert every result IS `success`, rather than listing failures: a
      # denylist fails open the day the platform invents a new outcome.
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }
          echo "All CI jobs succeeded"
