name: Nightly Vercel Sandbox

# The Vercel provider through the provider-conformance suite against a real
# Vercel account: the network policy enforced by the platform, a command
# found again from another process, the orphan sweep. Outside the CI gate
# (not in `complete.needs`): it spends money and depends on Vercel. Skipped
# without the `VERCEL_TOKEN` secret; a failure opens an issue.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vercel-conformance:
    name: Vercel Conformance
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hypotenuse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Skip without a Vercel token
        if: env.VERCEL_TOKEN == ''
        working-directory: .
        run: echo "VERCEL_TOKEN is not set; nothing to run."
      - uses: actions/checkout@v5
        if: env.VERCEL_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.VERCEL_TOKEN != ''
      - run: bun install --frozen-lockfile
        if: env.VERCEL_TOKEN != ''
        working-directory: .
      - run: cp .env.example .env
        if: env.VERCEL_TOKEN != ''
      - run: bun test __tests__/sandbox/vercel.conformance.test.ts
        if: env.VERCEL_TOKEN != ''
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/hypotenuse_test
          DATABASE_AUTO_MIGRATE_TEST: "true"
          REDIS_URL_TEST: redis://localhost:6379/1
          # Its own managed tag, so this run's sweep never touches a
          # deployment's sandboxes in a shared Vercel project.
          SANDBOX_MANAGED_TAG: hypotenuse-nightly
      - name: Open an issue on failure
        if: failure() && env.VERCEL_TOKEN != ''
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly Vercel sandbox conformance failed";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-vercel",
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["nightly-vercel"],
              body: `The run at ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} failed.`,
            });
