<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <title>Hypotenuse</title>
    <!--
      The link preview. Every route serves this file, so every shared URL unfurls
      as the home page. Crawlers want absolute URLs; public/social.png is drawn by
      `bun run social:image`, and social.test.ts holds its size to these tags.
    -->
    <meta name="description" content="A persistent multiplayer, multichannel agent for your team: bots that answer in Slack, Linear, and Pylon with their own identity, tools, and memory." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hypotenuse" />
    <meta property="og:url" content="https://www.hypotenuse.cloud/" />
    <meta property="og:title" content="Hypotenuse — a teammate in every channel" />
    <meta property="og:description" content="A persistent multiplayer, multichannel agent for your team: bots that answer in Slack, Linear, and Pylon, and hand code to a sandbox that opens the pull request." />
    <meta property="og:image" content="https://www.hypotenuse.cloud/social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Hypotenuse: a teammate in every channel. A line runs from where your team talks to the work getting done." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hypotenuse — a teammate in every channel" />
    <meta name="twitter:description" content="A persistent multiplayer, multichannel agent for your team: bots that answer in Slack, Linear, and Pylon, and hand code to a sandbox that opens the pull request." />
    <meta name="twitter:image" content="https://www.hypotenuse.cloud/social.png" />
    <meta name="twitter:image:alt" content="Hypotenuse: a teammate in every channel. A line runs from where your team talks to the work getting done." />
    <!--
      Pre-paint theme. Runs before the stylesheet applies, so a stored Dark on a
      light OS never flashes white. ThemeContext owns the same key and logic
      afterwards; keep the two in step (THEME_STORAGE_KEY).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var stored = null;
        try {
          stored = localStorage.getItem("hypotenuse.theme");
        } catch (e) {}
        function apply() {
          var pref = stored === "light" || stored === "dark" ? stored : "system";
          root.dataset.theme = pref === "system" ? (query.matches ? "dark" : "light") : pref;
        }
        apply();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
