server {
  listen 10000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Render terminates TLS and forwards to this port, which the outside world
  # cannot reach. Any redirect nginx makes itself must stay relative, or it
  # names http://<host>:10000/ and never resolves.
  absolute_redirect off;

  # SPA fallback: client-side routes resolve to index.html rather than 404ing.
  # No `$uri/`: a directory under public/ must never answer for a route (it
  # would 301 to a trailing slash, then 403 for want of an index.html).
  location / {
    try_files $uri /index.html;
  }
}
