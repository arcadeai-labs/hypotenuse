# Reserved local tunnels. The agent's authtoken is *not* in this file — `bun run
# ngrok` merges the default config from `ngrok config add-authtoken` in front of
# these endpoints.
#
# GitHub's Setup URL (and every other browser hop that must leave localhost)
# lands on the backend tunnel. Disable the interstitial warning on both reserved
# domains in the ngrok dashboard, or the install redirect stops on a splash page.
#
# Upstream ports must match `WEB_SERVER_PORT` / frontend `PORT` (8080 / 3000).
# Dial IPv6 loopback, not 127.0.0.1: Vite and Bun with `host=localhost` listen
# on [::1] only, and ngrok's IPv4 dial is `connection refused` (ERR_NGROK_8012).
version: "3"
agent: {}
endpoints:
  - name: backend
    url: https://hypotenuse-local-backend.ngrok.app
    upstream:
      url: "http://[::1]:8080"
  - name: frontend
    url: https://hypotenuse-local-frontend.ngrok.app
    upstream:
      url: "http://[::1]:3000"
