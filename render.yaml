# Hypotenuse — Render blueprint. One file, one STAGING environment.
#
#   hypotenuse-api        type: web       backend/Dockerfile    HTTP, MCP, platform webhooks, dashboard sockets.
#                         health /api/health (non-2xx when unhealthy)
#                         api.hypotenuse.cloud                    No tasks, no migrations.
#   hypotenuse-worker     type: worker    backend/Dockerfile    Tasks + migrations. No HTTP.
#   hypotenuse-frontend   type: web       frontend/Dockerfile   nginx serving the Vite build.
#                         www.hypotenuse.cloud, and the apex redirecting to it
#   hypotenuse-redis      type: keyvalue                        Sessions, queues, pub/sub, leases, rate-limit buckets.
#   hypotenuse-db         postgres 18 + the `vector` extension  Everything else.
#
# Web and worker run the SAME image and differ only by environment. The worker
# owns migrations (`DATABASE_AUTO_MIGRATE=true`) so the web service can never race
# a schema change.
#
# Platforms deliver webhooks to hypotenuse-api, at routes fixed in
# backend/ops/WebhookUrlOps.ts and reported by GET /api/status under `webhooks`:
#
#   https://api.hypotenuse.cloud/api/webhooks/slack
#   https://api.hypotenuse.cloud/api/webhooks/linear
#   https://api.hypotenuse.cloud/api/webhooks/pylon
#
# Every bot's platform app embeds those URLs, so moving the API's origin means
# editing every installed app (docs/DEPLOY.md). Platform secrets are not
# environment variables: each bot's are stored encrypted with its installation.
#
# render-blueprint.test.ts derives its expectations from this file.

services:
  # ---------------------------------------------------------------------------
  # Backend — HTTP, MCP, platform webhook ingress, dashboard WebSockets
  # ---------------------------------------------------------------------------
  - type: web
    name: hypotenuse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # backend/Dockerfile COPYs the root `bun.lock`, so the build context is the
    # repo root, not backend/.
    dockerContext: .
    # 1 CPU / 2 GB, as a spec-based id. Never a marketing name: Render's
    # validator accepts `starter plus` and then silently creates nothing.
    plan: 1c-2g
    region: oregon
    branch: main
    autoDeploy: true
    # Render reads only the HTTP status, never a body: /api/health answers 500
    # until migration 0000 has created `vector` (and whenever Postgres or Redis
    # is unreachable), so such a deploy is held rather than promoted.
    # /api/status always answers 200 and is the report, not the probe.
    healthCheckPath: /api/health
    domains:
      - api.hypotenuse.cloud
    buildFilter:
      paths:
        - backend/**
        - bun.lock
        - package.json
    envVars:
      # Everything that must be byte-identical across web and worker, including
      # SECRETS_ENCRYPTION_KEY and the dashboard-only SMTP_* keys.
      - fromGroup: hypotenuse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: hypotenuse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hypotenuse-redis
          type: keyvalue
          property: connectionString
      - key: PROCESS_NAME
        value: "hypotenuse-api"
      - key: WEB_SERVER_HOST
        value: "0.0.0.0"
      - key: WEB_SERVER_PORT
        value: "10000"
      - key: WEB_SERVER_API_ROUTE
        value: "/api"
      # The frontend's public origin, and only it — a mismatch fails CORS.
      - key: WEB_SERVER_ALLOWED_ORIGINS
        value: "https://www.hypotenuse.cloud"
      # The OAuth authorize page's theme, generated from design/tokens.ts. Keryx
      # refuses to boot when this names a file that does not exist, and a
      # Blueprint sync never removes a key it does not mention, so the blueprint
      # owns this one.
      - key: WEB_SERVER_THEME
        value: "theme/hypotenuse-theme.ts"
      # Our own public origin: the OAuth/MCP issuer, and the base of every
      # webhook URL a platform app's manifest embeds.
      - key: APPLICATION_URL
        value: "https://api.hypotenuse.cloud"
      # Cross-origin frontend: SameSite=None, which browsers only honour with Secure.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: "None"
      - key: MCP_SERVER_ENABLED
        value: "true"
      # Behind Render's proxy, without this the OAuth issuer resolves to the
      # internal origin.
      - key: MCP_OAUTH_TRUST_PROXY
        value: "true"
      # The worker migrates and runs tasks. The web service must do neither: a
      # web process running agent ticks competes with webhook ingress for its
      # event loop, and Slack gives a webhook 3 seconds, Linear 5.
      - key: DATABASE_AUTO_MIGRATE
        value: "false"
      - key: TASKS_ENABLED
        value: "false"
      - key: TASK_PROCESSORS
        value: "0"

  # ---------------------------------------------------------------------------
  # Backend — tasks + migrations (same image as hypotenuse-api)
  # ---------------------------------------------------------------------------
  - type: worker
    name: hypotenuse-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: 1c-2g
    region: oregon
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - bun.lock
        - package.json
    envVars:
      - fromGroup: hypotenuse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: hypotenuse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hypotenuse-redis
          type: keyvalue
          property: connectionString
      - key: PROCESS_NAME
        value: "hypotenuse-worker"
      - key: WEB_SERVER_ENABLED
        value: "false"
      # The worker writes this origin into platform messages, and the framework
      # default is localhost.
      - key: APPLICATION_URL
        value: "https://api.hypotenuse.cloud"
      # This service, and only this service, owns the schema.
      - key: DATABASE_AUTO_MIGRATE
        value: "true"
      - key: TASKS_ENABLED
        value: "true"
      # Agent ticks spend most of their time waiting on a model, so one process
      # runs several. Queues drain ingress, outbox, agents, orchestrator, default.
      - key: TASK_PROCESSORS
        value: "4"

  # ---------------------------------------------------------------------------
  # Frontend — static bundle behind nginx
  # ---------------------------------------------------------------------------
  - type: web
    name: hypotenuse-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /
    # The apex is attached only so Render redirects it to www; no env var names it.
    domains:
      - www.hypotenuse.cloud
      - hypotenuse.cloud
    buildFilter:
      paths:
        - frontend/**
        # `tsc -b` resolves action response types through `@backend/*`, so a
        # backend change can break — or fix — the frontend build.
        - backend/**
        # The bundle imports the state table and the generated tokens.
        - design/**
        - bun.lock
        - package.json
    envVars:
      # Inlined at BUILD time; Render passes service env vars as build args.
      - key: VITE_API_URL
        value: "https://api.hypotenuse.cloud"

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: hypotenuse-redis
    plan: starter
    region: oregon
    ipAllowList: []
    # Sessions, every pending agent tick, conversation leases, pub/sub, and
    # rate-limit buckets live here. An evicted queue key is a conversation that
    # never wakes. Refuse writes instead.
    maxmemoryPolicy: noeviction

# -----------------------------------------------------------------------------
# Env vars that must be identical on web and worker
# -----------------------------------------------------------------------------
envVarGroups:
  - name: hypotenuse-shared
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: LOG_LEVEL
        value: "info"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_INCLUDE_TIMESTAMPS
        value: "true"
      # Render's log viewer shows ANSI escapes literally.
      - key: LOG_COLORIZE
        value: "false"

      # AES-256-GCM key for every credential this deployment stores. Declared
      # once, here: `generateValue: true` on two services mints two different
      # keys, and the worker could not decrypt what the API wrote.
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true

      # The frontend's public origin — the base of every dashboard link either
      # backend writes into a platform or an e-mail.
      - key: FRONTEND_URL
        value: "https://www.hypotenuse.cloud"

      # Set ONCE on this group in the Render dashboard, never in this file —
      # Render ignores `sync: false` inside an envVarGroup, and ignores it on a
      # service during Blueprint updates. Keys a sync does not mention are
      # preserved, and both backend services pull this group.
      #
      # Optional, read once accounts exist — without them no mail is sent:
      #
      #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM

databases:
  - name: hypotenuse-db
    plan: basic-256mb
    region: oregon
    # Requires the `vector` extension, which Render's managed Postgres ships and
    # migration 0000 creates. Without it the worker's first migration fails and
    # /api/status reports `healthy: false`.
    postgresMajorVersion: "18"
    ipAllowList: []
